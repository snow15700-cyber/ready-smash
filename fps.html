<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS 손맛 시안</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c22; user-select: none; -webkit-user-select: none; font-family: 'Pretendard Variable', system-ui, sans-serif; color: #fff; }
    #c, #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #hud { pointer-events: none; }
    .glass { background: rgba(15, 18, 45, .62); border: 1px solid rgba(255, 255, 255, .18); backdrop-filter: blur(10px); }
    .tag { position: fixed; left: 16px; top: 14px; padding: 7px 13px; border-radius: 14px; font-size: 13px; font-weight: 600; }
    .tag b { color: #FF8A1F; }
    #gear { position: fixed; right: 16px; top: 12px; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 19px; cursor: pointer; }
    #panel { position: fixed; right: 16px; top: 60px; width: min(320px, calc(100vw - 32px)); padding: 12px; border-radius: 18px; font-size: 12px; color: rgba(255, 255, 255, .85); display: none; z-index: 5; }
    #panel.open { display: block; }
    #panel .row { margin-bottom: 10px; }
    #panel .row > div { margin-bottom: 4px; font-weight: 600; }
    #panel button { font: 600 12px 'Pretendard Variable', system-ui, sans-serif; color: #fff; border: 0; border-radius: 99px; padding: 5px 10px; margin: 0 3px 3px 0; cursor: pointer; background: rgba(255, 255, 255, .14); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }
    #panel button.on { background: #FF8A1F; box-shadow: none; }
    #panel input[type=range] { width: 200px; vertical-align: middle; accent-color: #FF8A1F; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 9, 28, .45); z-index: 4; }
    #overlay.hide { display: none; }
    .card { width: min(560px, calc(100vw - 32px)); padding: 24px 26px 22px; border-radius: 26px; text-align: center; }
    .card h1 { font: 34px Jua, sans-serif; margin: 0 0 4px; letter-spacing: .5px; }
    .card h1 span { color: #3ff2ff; text-shadow: 0 0 12px rgba(63, 242, 255, .6); }
    .card p { margin: 0 0 16px; color: rgba(255, 255, 255, .7); font-size: 13px; }
    .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; margin-bottom: 18px; }
    .k { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, .8); font-weight: 600; }
    .caps { display: flex; gap: 3px; align-items: flex-end; min-height: 42px; }
    .cap { min-width: 30px; height: 30px; padding: 0 7px; border-radius: 8px; background: linear-gradient(#f4f5fb, #cfd3e6); color: #23264a; font: 700 13px 'Pretendard Variable', system-ui, sans-serif; display: grid; place-items: center; box-shadow: 0 3px 0 #8b90b3; }
    .cap.wide { min-width: 76px; }
    .wasd { display: grid; grid-template-columns: repeat(3, 30px); gap: 3px; }
    .wasd .cap:first-child { grid-column: 2; }
    .wasd .cap:nth-child(2) { grid-column: 1; }
    .mouse { width: 26px; height: 38px; border-radius: 13px; border: 2px solid #f4f5fb; position: relative; }
    .mouse::before { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 14px; background: #f4f5fb; }
    .mouse.left::after { content: ''; position: absolute; left: 0; top: 0; width: 11px; height: 14px; border-top-left-radius: 11px; background: #FF8A1F; }
    #start { font: 22px Jua, sans-serif; color: #fff; border: 0; border-radius: 99px; padding: 12px 38px; cursor: pointer; background: #FF8A1F; box-shadow: 0 0 24px rgba(255, 138, 31, .55); }
    .pc { display: none; margin-top: 12px; color: #ffd84a; font-size: 13px; }
    @media (pointer: coarse) { .pc { display: block; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="hud"></canvas>
  <div class="tag glass">🧪 <b>FPS 손맛 시안</b> · 허수아비 연습장 · 연결 없음</div>
  <button id="gear" class="glass" title="시험 설정">⚙️</button>
  <div id="panel" class="glass">
    <div class="row"><div>🖱️ 마우스 감도 <span id="sensV"></span> (이 기기에 저장)</div><input id="sens" type="range" min="0.3" max="3" step="0.05" /></div>
    <div class="row"><div>💥 반동 크기</div><button data-k="recoil" data-v="low">약</button><button data-k="recoil" data-v="mid">중</button><button data-k="recoil" data-v="high">강</button></div>
    <div class="row"><div>🔊 총소리</div><button data-k="gunSound" data-v="A">A '퉁' 묵직</button><button data-k="gunSound" data-v="B">B '퓽' 레이저</button></div>
    <div class="row"><div>✕ 맞힘 표시 모양</div><button data-k="mark" data-v="A">A 얇게</button><button data-k="mark" data-v="B">B 검은 테두리</button></div>
    <div class="row"><div>🎯 허수아비</div><button data-k="move" data-v="true">움직임</button><button data-k="move" data-v="false">가만히</button></div>
    <div class="row"><div>🎨 빛 테두리 색</div><button data-k="teams" data-v="true">두 팀 (빨강·파랑)</button><button data-k="teams" data-v="false">모두 적 (빨강)</button></div>
    <div class="row"><div>🔈 소리 크기</div><button data-k="vol" data-v="0">끔</button><button data-k="vol" data-v="0.4">작게</button><button data-k="vol" data-v="0.7">보통</button><button data-k="vol" data-v="1">크게</button></div>
  </div>
  <div id="overlay">
    <div class="card glass">
      <h1>준비하시고, <span>쏘세요!</span></h1>
      <p>허수아비 연습장 — 머리 1방 · 몸 2방</p>
      <div class="keys">
        <div class="k"><div class="caps"><div class="wasd"><div class="cap">W</div><div class="cap">A</div><div class="cap">S</div><div class="cap">D</div></div></div>움직이기</div>
        <div class="k"><div class="caps"><div class="mouse"></div></div>둘러보기</div>
        <div class="k"><div class="caps"><div class="mouse left"></div></div>쏘기 (누르고 있으면 계속)</div>
        <div class="k"><div class="caps"><div class="cap wide">Space</div></div>점프</div>
        <div class="k"><div class="caps"><div class="cap wide">Shift</div></div>대시 (3초마다)</div>
        <div class="k"><div class="caps"><div class="cap">Esc</div></div>멈추고 설정 ⚙️</div>
      </div>
      <button id="start">클릭해서 시작</button>
      <div class="pc">📱 PC에서만 할 수 있어요 (키보드·마우스)</div>
    </div>
  </div>
  <script type="module" src="/src/games/fps/page.js"></script>
</body>
</html>
