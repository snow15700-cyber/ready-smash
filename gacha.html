<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뽑기 시안</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1633; }
    /* 위: 시험용 버튼 (실제 게임에는 없음). 연출 화면(z-index 15)보다 위에 */
    .bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 18px; z-index: 30;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); font: 13px 'Pretendard Variable', system-ui, sans-serif; color: rgba(255,255,255,.6); white-space: nowrap; }
    .bar button { font: 600 13px 'Pretendard Variable', system-ui, sans-serif; color: #fff; border: 0; border-radius: 99px; padding: 5px 10px; cursor: pointer; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
    .bar button.on { background: #FF8A1F; box-shadow: none; }
    @media (max-width: 560px) { .bar { top: 58px; font-size: 12px; } .bar button { font-size: 12px; padding: 4px 8px; } }
  </style>
</head>
<body>
  <div class="bar">시험용 등급
    <button data-k="force" data-v="random">진짜 확률</button>
    <button data-k="force" data-v="common">일반</button>
    <button data-k="force" data-v="rare">고급</button>
    <button data-k="force" data-v="legend">전설</button>
  </div>
  <script type="module" src="/src/gacha-page.js"></script>
</body>
</html>
