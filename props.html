<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>광장 물건 시안</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Jua, sans-serif; background: #eef6ff; color: #23304a; }
    h1 { margin: 14px 16px 2px; font-size: 24px; }
    p.hint { margin: 0 16px 8px; font-size: 14px; color: #5a6a80; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 16px 10px; position: sticky; top: 0; z-index: 5; padding: 6px 0; background: #eef6ffee; }
    .bar button { font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 6px 12px; background: #fff; color: #23304a; box-shadow: 0 1px 3px rgba(0,0,0,.12); cursor: pointer; }
    .bar button.on { background: #2f6fe0; color: #fff; }
    .bar b { align-self: center; font-weight: normal; font-size: 13px; color: #5a6a80; margin-left: 6px; }
    .wrap { position: relative; margin: 0 16px 16px; }
    #c { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    h2.sec { grid-column: 1 / -1; margin: 14px 0 0; font-size: 21px; }
    h2.sec small { font-size: 13px; color: #5a6a80; }
    .cell { height: 260px; border-radius: 16px; background: linear-gradient(180deg, #dcefff, #b9dcf6); position: relative; cursor: grab; }
    .cell.truck { height: 330px; background: linear-gradient(180deg, #cfe9ff, #f3e7cf); }
    .cell.sit { background: linear-gradient(180deg, #e6f6e0, #c4e6b8); }
    .cell.big { grid-column: 1 / -1; height: 72vh; }
    .cell span, .cell small { z-index: 2; }
    .cell span { position: absolute; left: 10px; bottom: 8px; font-size: 17px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
    .cell span i { display: inline-block; min-width: 26px; height: 26px; margin-right: 4px; border-radius: 50%; background: #e0333c; color: #fff; font-style: normal; text-align: center; line-height: 26px; text-shadow: none; }
    .cell small { position: absolute; left: 10px; top: 8px; right: 10px; font-family: 'Pretendard Variable', system-ui, sans-serif; font-size: 12px; color: #3d4a60; }
    /* 메뉴 창 시안 (누르면 뜨는 창) */
    .pop { grid-column: span 1; min-height: 330px; border-radius: 16px; padding: 14px 14px 44px; background: linear-gradient(160deg, #7fb6e8, #f0c27a); position: relative; font-family: 'Pretendard Variable', system-ui, sans-serif; }
    .pop .tag { position: absolute; left: 10px; bottom: 8px; font-family: Jua, sans-serif; font-size: 17px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
    .pop .tag i { display: inline-block; min-width: 26px; height: 26px; margin-right: 4px; border-radius: 50%; background: #e0333c; font-style: normal; text-align: center; line-height: 26px; text-shadow: none; }
    .glass { background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 18px; color: #fff; padding: 12px; box-shadow: 0 6px 24px rgba(30,40,80,.18); }
    .glass h3 { margin: 0 0 8px; font-family: Jua, sans-serif; font-size: 18px; font-weight: normal; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { background: rgba(255,255,255,.9); color: #23304a; border-radius: 14px; padding: 8px 6px; text-align: center; }
    .card img { width: 58px; height: 58px; display: block; margin: 0 auto 2px; }
    .card b { display: block; font-family: Jua, sans-serif; font-weight: normal; font-size: 16px; }
    .card em { display: block; font-style: normal; font-size: 11px; color: #5a6a80; margin: 2px 0 6px; }
    .coin { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 4px 12px; background: #e0333c; color: #fff; font: 700 13px/1.2 'Pretendard Variable', system-ui, sans-serif; }
    .coin::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #ff9a3d; box-shadow: inset 0 0 0 2px #fff6; }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.9); color: #23304a; border-radius: 12px; padding: 4px 8px; }
    .row img { width: 42px; height: 42px; }
    .row div { flex: 1; } .row b { font-family: Jua, sans-serif; font-weight: normal; font-size: 16px; display: block; } .row em { font-style: normal; font-size: 11px; color: #5a6a80; }
    .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: rgba(43,42,51,.55); color: #fff; border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 700; }
    .pill img { width: 24px; height: 24px; background: #fff; border-radius: 50%; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .cell { height: 240px; } .pop { grid-column: auto; } }
  </style>
</head>
<body>
  <h1>🧩 광장 물건 시안 — 메뉴판 · 손에 든 것 · 앉은 모습</h1>
  <p class="hint">칸마다 번호가 있어요. 마음에 드는 번호를 골라 주세요(섞어도 돼요). 칸을 끌면 돌려 보고, <b>두 번 누르면 크게</b> 볼 수 있어요. (plaza.md 10장 ①)</p>
  <div class="bar" id="bar"></div>
  <div class="wrap"><div class="grid" id="grid"></div><canvas id="c"></canvas></div>
  <script type="module" src="/src/games/props/draft-page.js"></script>
</body>
</html>
