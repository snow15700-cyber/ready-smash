<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>찬스볼 잔상 시안</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; overflow: hidden; font-family: Jua, sans-serif; background: #efe3cc; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .bar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .bar button { font-family: inherit; font-size: 15px; border: 0; border-radius: 99px; padding: 6px 12px; background: rgba(255,255,255,0.8); cursor: pointer; }
    .bar button.on { background: #ff8a3d; color: #fff; }
    .cap { position: fixed; left: 12px; bottom: 12px; font-size: 20px; background: rgba(255,255,255,0.85); padding: 6px 14px; border-radius: 12px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar" id="bar"></div>
  <div class="cap" id="cap"></div>
  <script type="module" src="/src/trail-page.js"></script>
</body>
</html>
