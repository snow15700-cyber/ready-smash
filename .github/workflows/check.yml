# 자동 점검: test·main에 올리거나 PR을 만들면 GitHub가 npm run check를 돌린다.
# 결과는 GitHub 저장소의 'Actions' 탭(초록 ✓ / 빨강 ✗)에서 본다. 배포(Vercel)와는 따로라 실패해도 배포는 막지 않는다.
name: 자동 점검
on:
  push:
    branches: [test, test-fps, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 점검
        run: npm run check
        env:
          CHECK_PG: postgres://postgres:postgres@localhost:5432
